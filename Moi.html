function renderSidebar(){const query=$('search').value.toLowerCase().trim();let loose=state.notes.filter(n=>!n.folderId&&(!query||(n.title+' '+plain(n.main)).toLowerCase().includes(query)));let html=`<div class="section-label"><span>${tr('allNotes')}</span><span class="count">${state.notes.length}</span></div>`;if(!loose.length)html+=`<button class="side-row" style="color:var(--muted)" disabled><span class="row-icon">◌</span><span class="row-title">${query?'Aucun résultat':tr('noNotes')}</span></button>`;for(let n of loose)html+=noteRow(n);html+=`<div class="section-label"><span>${tr('folders')}</span><button class="folder-toggle" data-action="folder-add" title="${tr('newFolder')}">＋</button></div>`;for(let f of state.folders){let notes=state.notes.filter(n=>n.folderId===f.id&&(!query||(n.title+' '+plain(n.main)).toLowerCase().includes(query)));let expanded=state.folderExpanded[f.id]!==false;html+=`<div class="folder-heading"><button class="folder-toggle" data-action="toggle-folder" data-id="${f.id}">${expanded?'⌄':'›'}</button><button class="side-row ${state.selectedFolder===f.id?'active':''}" data-action="folder" data-id="${f.id}" style="flex:1"><span class="row-icon">📁</span><span class="row-title">${esc(f.name)}</span><span class="count">${notes.length}</span></button><button class="folder-toggle" data-action="folder-menu" data-id="${f.id}" title="Options">···</button></div>`;if(expanded)html+=`<div class="folder-notes">${notes.map(noteRow).join('')}${!notes.length?`<div style="padding:7px 9px;color:var(--muted);font-size:11px">${tr('emptyFolder')}</div>`:''}</div>`;} $('side-list').innerHTML=html;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>sideAction(b.dataset.action,b.dataset.id));}

function newFolder(){let name=prompt(tr('newFolderPrompt'));if(!name?.trim())return;let f={id:uuid(),name:name.trim(),createdAt:new Date().toISOString()};state.folders.push(f);state.folderExpanded[f.id]=true;state.selectedFolder=f.id;state.currentView='folder';render();scheduleSave()}function renameFolder(id){let f=state.folders.find(x=>x.id===id);if(!f)return;let name=prompt(tr('rename'),f.name);if(name?.trim()){f.name=name.trim();render();scheduleSave()}}function deleteFolder(id){let f=state.folders.find(x=>x.id===id);if(!f)return;if(!confirm(`${tr('delete')} « ${f.name} » ? Les notes seront conservées dans Toutes les notes.`))return;state.notes.forEach(n=>{if(n.folderId===id)n.folderId=null});state.folders=state.folders.filter(x=>x.id!==id);state.selectedFolder=null;state.currentView='all';render();scheduleSave()}function folderMenu(id){let f=state.folders.find(x=>x.id===id);if(!f)return;let action=prompt(`${f.name}\n1 = ${tr('rename')}\n2 = ${tr('delete')}\n3 = ${tr('newNote')}`);if(action==='1')renameFolder(id);if(action==='2')deleteFolder(id);if(action==='3')pickMethod(id)}function deleteNote(id){if(!confirm(tr('deleteConfirm')))return;state.notes=state.notes.filter(n=>n.id!==id);state.selectedId=null;state.currentView=state.selectedFolder?'folder':'all';render();scheduleSave()}function noteMenu(id){let a=prompt('1 = '+tr('rename')+'\n2 = '+tr('delete')+'\n3 = Déplacer vers un dossier');if(a==='2')deleteNote(id);if(a==='1'){let n=state.notes.find(x=>x.id===id);let title=prompt(tr('rename'),n.title);if(title!==null){n.title=title;render();scheduleSave()}}if(a==='3')moveNote(id)}function moveNote(id){let options=['Aucun dossier',...state.folders.map(f=>f.name)];let v=prompt(options.map((x,i)=>`${i}: ${x}`).join('\n'));if(v===null)return;let i=Number(v),n=state.notes.find(x=>x.id===id);if(n&&Number.isInteger(i)&&i>=0&&i<options.length){n.folderId=i===0?null:state.folders[i-1].id;state.selectedId=null;state.currentView='all';render();scheduleSave()}}

function openSettings(tab='appearance'){state.settingsTab=tab;renderSettings()}function renderSettings(){let tabs=[['appearance',tr('appearance'),'◐'],['general',tr('general'),'⚙']];let content='';if(state.settingsTab==='appearance')content=`<h3>${tr('appearance')}</h3><div class="setting-row"><div><div class="setting-label">${tr('appearance')}</div><div class="setting-help">Choisis le mode clair, sombre ou celui de ton appareil.</div></div><select class="setting-control" id="set-appearance"><option value="system">${tr('system')}</option><option value="light">${tr('light')}</option><option value="dark">${tr('dark')}</option></select></div><div class="setting-row"><div><div class="setting-label">${tr('theme')}</div><div class="setting-help">Couleur principale des boutons et sélections.</div></div><select class="setting-control" id="set-theme"><option value="blue">${tr('blue')}</option><option value="purple">${tr('purple')}</option><option value="green">${tr('green')}</option><option value="orange">${tr('orange')}</option><option value="pink">${tr('pink')}</option><option value="custom">${tr('custom')}</option></select></div><div class="setting-row"><div><div class="setting-label">${tr('accent')}</div></div><input class="setting-control" type="color" id="set-accent" value="${state.settings.accent}"></div><div class="setting-row"><div><div class="setting-label">${tr('highlight')}</div></div><input class="setting-control" type="color" id="set-highlight" value="${state.settings.highlight}"></div>`;if(state.settingsTab==='general')content=`<h3>${tr('general')}</h3><div class="setting-row"><div><div class="setting-label">${tr('language')}</div><div class="setting-help">L'interface se met à jour selon la langue choisie.</div></div><select class="setting-control" id="set-language">${LANGS.map(l=>`<option value="${l[0]}" ${state.settings.language===l[0]?'selected':''}>${l[1]} ${l[2]}</option>`).join('')}</select></div><div class="setting-row"><div><div class="setting-label">Exporter mes notes</div><div class="setting-help">Télécharge une copie JSON de tes notes et dossiers.</div></div><button class="btn" id="export-notes">↓ ${tr('export')}</button></div><div class="setting-row"><div><div class="setting-label">Importer une sauvegarde</div><div class="setting-help">Importe un fichier JSON exporté depuis POLYNOTE.</div></div><label class="btn">↑ ${tr('import')}<input id="import-notes" type="file" accept="application/json,.json" hidden></label></div>`;
showModal(`<div class="modal-head"><h2>⚙ ${tr('settings')}</h2><button class="btn icon" data-close>×</button></div><div class="modal-body"><div class="settings-grid"><nav class="settings-nav">${tabs.map(t=>`<button class="${state.settingsTab===t[0]?'active':''}" data-setting-tab="${t[0]}">${t[2]} ${t[1]}</button>`).join('')}</nav><div class="settings-section">${content}</div></div><div class="modal-actions"><button class="btn" data-close>${tr('cancel')}</button><button class="btn primary" id="settings-done">${tr('done')}</button></div></div>`);document.querySelectorAll('[data-setting-tab]').forEach(b=>b.onclick=()=>openSettings(b.dataset.settingTab));if($('set-appearance'))$('set-appearance').value=state.settings.appearance;if($('set-theme'))$('set-theme').value=state.settings.theme;if($('set-accent'))$('set-accent').oninput=e=>{state.settings.accent=e.target.value;state.settings.theme='custom';applyTheme()};if($('set-highlight'))$('set-highlight').oninput=e=>{state.settings.highlight=e.target.value;applyTheme()};$('settings-done').onclick=()=>{if($('set-appearance'))state.settings.appearance=$('set-appearance').value;if($('set-theme'))state.settings.theme=$('set-theme').value;if($('set-accent'))state.settings.accent=$('set-accent').value;if($('set-highlight'))state.settings.highlight=$('set-highlight').value;let oldLang=state.settings.language;if($('set-language'))state.settings.language=$('set-language').value;persistLocal();applyTheme();closeModal();render();if(oldLang!==state.settings.language)toast(tr('settingsSaved'))};if($('export-notes'))$('export-notes').onclick=exportNotes;if($('import-notes'))$('import-notes').onchange=importNotes;}
function exportNotes(){let blob=new Blob([JSON.stringify({notes:state.notes,folders:state.folders},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='polynote-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}function importNotes(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.notes)||!Array.isArray(d.folders))throw Error('Format invalide');if(!confirm('Remplacer les notes actuelles par cette sauvegarde ?'))return;state.notes=d.notes;state.folders=d.folders;render();scheduleSave();closeModal();toast('Import terminé')}catch(err){alert('Impossible de lire ce fichier JSON.')}};r.readAsText(file)}
function openHelp(topic='app'){state.helpTopic=topic;renderHelp()}function renderHelp(){let appHelp=state.helpTopic==='app';let m=METHODS.find(x=>x[0]===state.helpTopic);let body=appHelp?`<h2>${tr('welcome')}</h2><p>POLYNOTE te permet d’organiser tes notes avec plusieurs structures, des dossiers et un éditeur de texte mis en forme.</p><h3>Commencer</h3><ol><li>Clique sur <b>Nouvelle note</b> puis choisis une méthode.</li><li>Écris dans les différentes zones de la note.</li><li>Renomme la note en cliquant sur son titre.</li><li>Crée des dossiers pour regrouper tes notes et déplace-les avec le menu de la note.</li><li>Ouvre Paramètres pour changer la langue et l’apparence ; règle la police depuis la barre d’outils de la note.</li></ol><h3>Sauvegarde</h3><p>Les modifications sont enregistrées automatiquement dans ce navigateur. Configure Supabase et connecte-toi pour synchroniser les notes dans le cloud.</p>`:`<h2>${methodName(m[0])}</h2><p>${methodDescription(m[0])}</p><ul>${(m[0]==='cornell'?['Colonne de gauche : mots-clés, indices et questions.','Grande colonne : notes détaillées.','Zone du bas : résumé des notions essentielles.']:m[0]==='outline'?['Organise les idées avec des titres et sous-niveaux.','Utilise les retraits pour rendre la hiérarchie visible.']:m[0]==='charting'?['Chaque colonne accueille un type d’information.','Utile pour comparer des concepts, des dates ou des définitions.']:m[0]==='sentence'?['Note une idée principale par ligne.','Numérote les idées pour les retrouver facilement.']:m[0]==='boxBullets'?['Répartis les thèmes entre quatre blocs.','Utilise des puces pour les détails et exemples.']:['Utilise la page comme tu le souhaites.','La barre d’outils permet de mettre le texte en forme.']).map(x=>`<li>${x}</li>`).join('')}</ul><div class="notice">Astuce : tu peux modifier la police, la taille, la couleur et le surlignage depuis la barre d’outils.</div>`;showModal(`<div class="modal-head"><h2>ⓘ ${tr('helpTitle')}</h2><button class="btn icon" data-close>×</button></div><div class="help-layout"><nav class="help-nav"><button class="${appHelp?'active':''}" data-help-topic="app">📘 ${tr('helpApp')}</button>${METHODS.map(x=>`<button class="${state.helpTopic===x[0]?'active':''}" data-help-topic="${x[0]}">${x[1]} ${esc(methodName(x[0]))}</button>`).join('')}</nav><article class="help-content">${body}</article></div>` ,true);document.querySelectorAll('[data-help-topic]').forEach(b=>b.onclick=()=>openHelp(b.dataset.helpTopic))}
function openAccount(){renderAccount()}function renderAccount(){const configured=!!(state.supabaseUrl&&state.supabaseKey);let body='';if(!configured){body=`<div class="notice">Le compte en ligne n’est pas encore configuré par la propriétaire de POLYNOTE. Réessaie plus tard.</div>`;}else if(state.user){body=`<div class="notice">${tr('cloudReady')}<br>${esc(state.user.email||'')}</div><div class="modal-actions"><button class="btn" id="sync-now">☁ ${tr('syncNow')}</button><button class="btn danger" id="sign-out">${tr('logout')}</button></div>`;}else{body=`<div class="notice">Crée ton compte pour retrouver tes notes sur tes appareils.</div><div class="auth-tabs"><button class="${state.authMode==='login'?'active':''}" id="tab-login">${tr('login')}</button><button class="${state.authMode==='signup'?'active':''}" id="tab-signup">${tr('signup')}</button></div><form id="auth-form"><div class="field"><label>${tr('email')}</label><input type="email" id="auth-email" required autocomplete="email"></div><div class="field"><label>${tr('password')}</label><input type="password" id="auth-password" required minlength="6" autocomplete="${state.authMode==='login'?'current-password':'new-password'}"></div><button class="btn primary" type="submit" style="width:100%">${tr(state.authMode==='login'?'signIn':'signup')}</button><p class="auth-status" id="auth-status" style="margin-top:12px"></p></form><button class="btn ghost" id="forgot-password">${tr('resetPassword')}</button>`;}showModal(`<div class="modal-head"><h2>☁️ ${tr('accountTitle')}</h2><button class="btn icon" data-close>×</button></div><div class="modal-body">${body}</div>`);if($('tab-login'))$('tab-login').onclick=()=>{state.authMode='login';renderAccount()};if($('tab-signup'))$('tab-signup').onclick=()=>{state.authMode='signup';renderAccount()};if($('auth-form'))$('auth-form').onsubmit=authSubmit;if($('forgot-password'))$('forgot-password').onclick=resetPassword;if($('sync-now'))$('sync-now').onclick=syncNow;if($('sign-out'))$('sign-out').onclick=signOut;}
async function initSupabase(){if(!state.supabaseUrl||!state.supabaseKey||!window.supabase)return;try{state.client=window.supabase.createClient(state.supabaseUrl,state.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await state.client.auth.getSession();if(error)throw error;state.user=data.session?.user||null;state.client.auth.onAuthStateChange((_event,session)=>{state.user=session?.user||null;if(state.user)loadCloud();updateAccountUI()});if(state.user)await loadCloud()}catch(e){console.error(e);state.client=null;state.user=null;toast('Connexion à Supabase impossible : vérifie l’URL et la clé.') }updateAccountUI()}
async function authSubmit(e){e.preventDefault();let email=$('auth-email').value.trim(),password=$('auth-password').value,status=$('auth-status');status.textContent='…';if(!state.client){status.textContent='Le service de compte n’est pas configuré.';return}try{let res;if(state.authMode==='signup')res=await state.client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});else res=await state.client.auth.signInWithPassword({email,password});if(res.error)throw res.error;if(state.authMode==='signup'&&!res.data.session){status.textContent='Compte créé. Vérifie ta boîte e-mail si la confirmation est activée dans Supabase.';return}state.user=res.data.user||res.data.session?.user;await loadCloud();render();renderAccount();toast(tr('authSuccess'))}catch(err){status.textContent=err.message||'Une erreur est survenue.'}}
async function loadCloud(){if(!state.client||!state.user)return;try{const {data,error}=await state.client.from('polynote_data').select('data').eq('user_id',state.user.id).maybeSingle();if(error)throw error;if(data?.data&&Array.isArray(data.data.notes)&&Array.isArray(data.data.folders)){state.notes=data.data.notes;state.folders=data.data.folders;persistLocal();render();$('save-state').textContent='☁ '+tr('saved')}else await saveData()}catch(e){console.error(e);toast('Compte connecté, mais impossible de charger les notes. Vérifie la table et les règles RLS dans Supabase.')}}async function syncNow(){await saveData();toast('Synchronisation demandée.')}async function signOut(){if(state.client)await state.client.auth.signOut();state.user=null;render();renderAccount();toast('Déconnecté.')}async function resetPassword(){let email=$('auth-email')?.value.trim();if(!email){toast('Entre ton adresse e-mail d’abord.');return}try{let {error}=await state.client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;$('auth-status').textContent='Si cette adresse existe, un lien de réinitialisation sera envoyé.'}catch(e){$('auth-status').textContent=e.message}}
function updateAccountUI(){if(state.user){$('account-email').textContent=state.user.email||'Compte connecté';$('account-state').textContent=tr('cloudReady');$('avatar').textContent=(state.user.email||'P').slice(0,1).toUpperCase()}else{$('account-email').textContent=tr('local');$('account-state').textContent=state.supabaseUrl?tr('localOnly'):tr('notConfigured');$('avatar').textContent='P'}}
$('new-note').onclick=()=>pickMethod();$('new-folder').onclick=newFolder;$('settings-btn').onclick=()=>openSettings('appearance');$('settings-top').onclick=()=>openSettings('appearance');$('help-btn').onclick=()=>openHelp('app');$('help-top').onclick=()=>openHelp('app');$('account-btn').onclick=openAccount;$('search').oninput=renderSidebar;$('mobile-menu').onclick=()=>$('sidebar').classList.toggle('open');window.addEventListener('beforeunload',()=>{if(state.dirty)persistLocal()});window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='n'){e.preventDefault();pickMethod()}if(e.key==='Escape')closeModal()});
loadLocal();render();if(state.supabaseUrl&&state.supabaseKey)initSupabase();
</script></body></html>
